<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-exchange-alt"></i> Currency Converter</h1>
      <button id="theme-toggle" class="theme-btn" title="Toggle Dark/Light Mode">
        <i class="fas fa-moon"></i>
      </button>
    </div>

    <!-- Converter Card -->
    <div class="converter-card">
      <!-- Amount -->
      <div class="input-group">
        <label for="amount">Amount</label>
        <input type="number" id="amount" value="1" min="0" step="any" placeholder="Enter amount">
      </div>

      <!-- From Currency -->
      <div class="input-group">
        <label for="from-currency">From</label>
        <div class="select-wrapper">
          <select id="from-currency"></select>
        </div>
      </div>

      <!-- Swap Button -->
      <div class="swap-container">
        <button id="swap-btn" class="swap-btn" title="Swap Currencies">
          <i class="fas fa-arrows-alt-v"></i>
        </button>
      </div>

      <!-- To Currency -->
      <div class="input-group">
        <label for="to-currency">To</label>
        <div class="select-wrapper">
          <select id="to-currency"></select>
        </div>
      </div>

      <!-- Convert Button -->
      <button id="convert-btn" class="convert-btn">
        <i class="fas fa-sync-alt"></i> Convert
      </button>

      <!-- Result -->
      <div class="result-box" id="result-box">
        <div class="result-amount" id="result-amount">1.00 USD = 1.00 USD</div>
        <div class="result-rate" id="result-rate">Exchange Rate: 1</div>
        <div class="result-time" id="result-time"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      Created By Adityacse2027
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
